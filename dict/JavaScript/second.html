<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body>
   <ul class="language">
    <li>JavaScript</li>
   </ul>
</body>
<script>
    function addlanaguage(langName){
        const li=document.createElement('li');
        li.innerHTML=`${langName}`;

        document.querySelector('.language').appendChild(li);
        
    }

    addlanaguage('Python');
    addlanaguage('C#');
    addlanaguage('C++');
    addlanaguage('Java');


    function addOptimizedLanguage(langName){
        const li=document.createElement('li');
        li.appendChild(document.createTextNode(langName));
        document.querySelector('.language').appendChild(li);
        
    }
    addOptimizedLanguage('PHP');
    // edit any language
   const secondLanguage=document.querySelector('li');
   const newLi=document.createElement('li:nth-child(2)');
   newLi.appendChild(document.createTextNode('Ruby'));
   document.querySelector('.language').replaceChild(newLi, secondLanguage);


   // remove function
   //if we want to pass the language name to remove it, we can use the following function
   function RemoveLanguage(langName){
    const selectedLanguage=document.querySelector('li');
    const newselectedLanuage=selectedLanguage(`${langName}`)
    
     newselectedLanuage.remove();
   }
   RemoveLanguage('C#');
   RemoveLanguage('python')
</script>
</html>
