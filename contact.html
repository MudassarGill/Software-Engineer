<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact form</title>
</head>
<body>
    <h1>
        Sign Up Form
    </h1>
    <br>
    <form action="/table.html">
        <input type="text" placeholder="Enter your name">
        <br>
        <br>
        <input type="email" placeholder="Enter your email">
        <br>
        <br>
        <input type="password" placeholder="Enter your password">
        <br>
        <br>
        Select your Geneder:
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <br>
        <br>

        Select your Country:
        <select name="country" id="country">
            <option value="pakistan">Pakistan</option>
            <option value="india">India</option>
            <option value="china">China</option>
            <option value="usa">USA</option>
        </select>
        <br>
        <br>

         Select your Subjects:

        <input type="checkbox" id="subjects" name="math" value="math">
        <label for="subjects">Math</label>
        <input type="checkbox" id="subjects" name="science" value="science">
        <label for="subjects">Science</label>
        <input type="checkbox" id="subjects" name="english" value="english">
        <label for="subjects">English</label>
        <br>
        <br>

        <textarea name="feedback" placeholder="Enter your feedback",></textarea>
        <br>
        <br>

        <iframe  width="560" height="315"  src="https://www.youtube.com/embed/HcOc7P5BMi4?si=ZjTlD0ALeb23tDe-" controls title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        <br>
        <br>







        <input type="submit" value="Submit">
    </form>
</body>
</html>
