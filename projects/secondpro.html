<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="secondpro.css">
</head>
<body>
    <div class="container">
        <h1>BMI Calculator</h1>
        <form class="form">
            <p><label for="weight">Weight (kg):</label>
            </p>
            <p><input type="number" id="weight" name="weight" required></p>
            <p><label for="height">  Height (cm)   </label></p>
            <p><input type="number" id="height" name="height" required></p>
            <p><button type="submit">Calculate BMI</button></p>
        </form>
    </div>

    <script src="secondpro.js"></script>
</body>
</html>
